<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Very Long Boards</title>
    <meta property="og:title" content="Very Long Boards · magmacrunch media">
    <meta property="og:description" content="Play Very Long Boards in the magmacrunch arcade">
    <meta property="og:image" content="https://magmacrunch.com/og/arcade-very-long-boards.png?v=1">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="magmacrunch media">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/arcade-base.css?v=de5e0d7b">
    <link rel="stylesheet" href="css/style.css?v=37923223">
</head>
<body>
    <a href="../action/" class="mc-back">action games</a>

    <div id="game-container">
        <canvas id="renderCanvas"></canvas>
        <canvas id="garageCanvas" width="960" height="540" style="display:none; position:absolute; inset:0; z-index:1; pointer-events:none;"></canvas>

        <div id="titleScreen" class="overlay active">
            <div class="title-text">
                <div class="title-main">VERY LONG<br>BOARDS</div>
                <div class="title-sub">downhill skateboarding</div>
                <div class="title-carl">a carl spatski game</div>
            </div>
            <div class="insert-coin" id="startPrompt" data-keys="— PRESS ENTER TO START —" data-touch="— TAP TO START —"></div>
        </div>

        <div id="charSelect" class="overlay">
            <div class="cs-title">SELECT YOUR CARL</div>
            <div class="cs-cards" id="charCards"></div>
            <div class="cs-hint" data-keys="(LEFT) (RIGHT) TO SELECT &nbsp; ENTER TO PLAY" data-touch="TAP A CARL, THEN TAP AGAIN TO PLAY"></div>
        </div>

        <div id="boardSelect" class="overlay">
            <div class="bs-title">CHOOSE YOUR BOARD</div>
            <div class="bs-cards" id="boardCards"></div>
            <div class="cs-hint" data-keys="(LEFT) (RIGHT) TO SELECT &nbsp; ENTER TO RIDE" data-touch="TAP A BOARD, THEN TAP AGAIN TO RIDE"></div>
        </div>

        <div id="countdownOverlay" class="overlay">
            <div id="countdownText">3</div>
            <div class="how-to">
                <div data-keys="(LEFT) (RIGHT) CARVE TO KEEP YOUR BALANCE" data-touch="HOLD LEFT OR RIGHT SIDE TO CARVE"></div>
                <div data-keys="(UP) OLLIE OVER ROCKS AND BRANCHES" data-touch="TAP THE MIDDLE TO OLLIE"></div>
            </div>
        </div>

        <div id="hud" style="display:none;">
            <div class="hud-score">SCORE: <span id="hudScore">0</span></div>
            <div class="hud-speed">SPEED: <span id="hudSpeed">0</span> km/h</div>
            <div class="hud-dist">DIST: <span id="hudDist">0</span>m</div>
            <div id="hudBalanceWrap" class="hud-balance">
                <div class="hud-balance-label"><span class="hb-ok">BALANCE</span><span class="hb-low">CARVE!</span></div>
                <div class="hud-balance-track"><div id="hudBalance" class="hud-balance-fill"></div></div>
            </div>
            <div id="hudTrick">OLLIE!</div>
            <div id="kickPrompt" data-keys="PRESS (UP) TO KICK OFF" data-touch="TAP THE MIDDLE TO KICK OFF"></div>
        </div>

        <div id="gameOver" class="overlay">
            <div class="go-title">GAME OVER</div>
            <div class="go-cause" id="goCause">SPLAT!</div>
            <div class="go-hint" id="goHint"></div>
            <div class="go-score">SCORE: <span id="goScore">0</span></div>
            <div class="go-dist">DISTANCE: <span id="goDist">0</span>m</div>
            <div class="go-best">BEST: <span id="goBest">0</span></div>

            <div class="go-leaderboard">
                <div class="lb-title">TOP RIDERS</div>
                <div id="goBoard" class="lb-list"></div>
            </div>

            <div id="goRanked" class="go-ranked"></div>

            <div id="goInitials" class="go-initials">
                <label for="goInitialsInput">YOU RANKED! ENTER INITIALS</label>
                <input id="goInitialsInput" maxlength="3" autocomplete="off"
                       spellcheck="false" aria-label="Your initials, three letters">
                <div class="go-initials-hint">ENTER TO SAVE &nbsp; ESC TO SKIP</div>
            </div>

            <div class="go-actions">
                <div class="go-action" data-action="retry">
                    <span class="go-key" data-keys="ENTER" data-touch="TAP"></span> RIDE AGAIN
                </div>
                <div class="go-action" data-action="setup">
                    <span class="go-key">TAB</span> NEW SETUP
                </div>
            </div>
        </div>

        <div id="pauseScreen" class="overlay">
            <div class="pause-text">PAUSED</div>
            <div class="insert-coin" data-keys="— PRESS ESC TO RESUME —" data-touch="— TAP TO RESUME —"></div>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="../shared/adenosine-score-client.js?v=8c6493d6"></script>
    <script src="../shared/score-server.js?v=9acd988c"></script>
    <script>
const scoreClient=new AdScore.ScoreClient().auto(MC_SCORE_OPTS);
</script>

    <script src="js/player.js?v=867957f9"></script>
    <script src="js/obstacles.js?v=ab1a9dae"></script>
    <script src="js/scenery.js?v=8f75d2c0"></script>
    <script src="js/particles.js?v=8ec9b715"></script>
    <script src="js/statbars.js?v=ee25dafc"></script>
    <script src="js/hud.js?v=542d710b"></script>
    <script src="js/input.js?v=c0c89ce6"></script>
    <script src="js/audio.js?v=d2202f5a"></script>
    <script src="js/garage.js?v=8526920f"></script>
    <script src="js/main.js?v=a0760173"></script>

</body>
</html>
