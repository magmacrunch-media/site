<body>
<a href="../action/" class="mc-back">action games</a>

<div id="wrap">
  <canvas id="c" width="480" height="720"></canvas>

  <div id="title" class="title-screen">
    <h1>CALDERA</h1>
    <p class="sub-title">the only way out is up</p>
    <button id="btnStart" class="start-prompt">
      <span class="keys-only">PRESS ENTER</span><span class="touch-only">TAP TO CLIMB</span>
    </button>
    <button id="btnSound" class="sound-toggle" aria-pressed="false">SOUND: ON</button>
    <p class="copyright">&copy; 2026 MAGMACRUNCH MEDIA</p>
  </div>

  <div id="initials" class="panel panel-initials" hidden>
    <input id="initialsInput" maxlength="3" autocomplete="off" autocapitalize="characters"
           spellcheck="false" placeholder="AAA" aria-label="Your initials">
    <button id="initialsSave" class="btn">SAVE</button>
  </div>

  <div id="over" class="panel panel-over" hidden>
    <button id="btnAgain" class="btn">
      <span class="keys-only">ENTER: </span>CLIMB AGAIN
    </button>
    <button id="btnChange" class="btn btn-ghost">CHANGE CLIMBER</button>
  </div>

  <div id="charModal" class="char-modal" hidden>
    <div class="char-modal-content">
      <h2>select your climber</h2>
      <div id="charGrid" class="char-grid" role="listbox" aria-label="Climbers"></div>
      <p id="charBlurb" class="char-blurb"></p>
      <button id="charDone" class="btn">DONE</button>
      <p class="char-keys keys-only">ARROWS: CHOOSE &middot; ENTER: DONE</p>
    </div>
  </div>

  <button id="btnPause" class="btn-pause" aria-label="Pause" hidden>II</button>
</div>
