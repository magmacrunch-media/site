    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-titlebar">
                <span>SETTINGS</span>
                <button id="closeSettings" class="modal-close">✕</button>
            </div>
            <div class="modal-body">
                <form id="settingsForm">
                    <div class="settings-group">
                        <div class="settings-group-title">AI DIFFICULTY</div>
                        <div class="settings-options">
                            <div class="settings-option">
                                <input type="radio" name="difficulty" id="diffEasy" value="easy">
                                <label for="diffEasy">Easy (depth 2)</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="difficulty" id="diffMedium" value="medium" checked>
                                <label for="diffMedium">Medium (depth 3)</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="difficulty" id="diffHard" value="hard">
                                <label for="diffHard">Hard (depth 4)</label>
                            </div>
                        </div>
                    </div>
                    <div class="settings-group">
                        <div class="settings-group-title">TIME CONTROL</div>
                        <div class="settings-options">
                            <div class="settings-option">
                                <input type="radio" name="timeControl" id="tcNone" value="none" checked>
                                <label for="tcNone">No Timer</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="timeControl" id="tcBlitz" value="blitz">
                                <label for="tcBlitz">Blitz (5 min)</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="timeControl" id="tcRapid" value="rapid">
                                <label for="tcRapid">Rapid (15 min)</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="timeControl" id="tcClassical" value="classical">
                                <label for="tcClassical">Classical (30 min)</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" id="closeSettingsBtn">START GAME</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="promotionModal" class="modal-overlay">
        <div class="modal-content promotion-content">
            <div class="modal-titlebar">
                <span>PROMOTE PAWN</span>
            </div>
            <div class="modal-body">
                <div class="promotion-title">Choose a piece:</div>
                <div class="promotion-pieces" id="promotionPieces"></div>
            </div>
        </div>
    </div>

    <template id="chessGameExtra">
        <div class="timer-container" id="timerContainer" style="display: none;">
            <div class="timer player" id="playerTime">5:00</div>
            <div class="timer ai" id="aiTime">5:00</div>
        </div>
        <div class="side-panel">
            <div class="move-history-panel">
                <div class="move-history-header"><span>MOVE HISTORY</span></div>
                <div class="move-history-list" id="moveHistoryList"></div>
            </div>
            <div id="chatPanel" class="chat-panel" style="display: none;">
                <div class="chat-header"><span>CHAT</span></div>
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." maxlength="200">
                    <button id="chatSendBtn" class="chat-send-btn">▶</button>
                </div>
            </div>
        </div>
    </template>

    <script src="../shared/board-game-template.js?v=1452e66e"></script>
    <script>
BoardGameTemplate.render({title:"CHESS",subtitle:"// CREAM SODA EDITION //",footer:["CLASSIC CHESS  ·  VS AI OPPONENT","ALGEBRAIC NOTATION  ·  PIXEL ART PIECES"],buttons:[{id:"startGameBtn",label:"CLICK OR PRESS SPACE TO START",cls:"primary",icon:""},{id:"multiplayerBtn",label:"MULTIPLAYER"},{id:"startSettingsBtn",label:"SETTINGS"},{id:"helpBtn",label:"HOW TO PLAY"},{id:"creditsBtn",label:"CREDITS"}],gameControls:[{id:"newGameBtn",label:"NEW GAME"},{id:"settingsBtn",label:"SETTINGS"},{id:"menuBtn",label:"MENU"}],gameOverMsg:"Checkmate!",instructions:"<h3>Chess Rules</h3><p>Chess is a classic two-player strategy board game. The goal is to checkmate your opponent's king.</p><h4>Setup</h4><ul><li>You are <strong>WHITE</strong></li><li>AI is <strong>BLACK</strong></li><li>White always moves first</li></ul><h4>Piece Movement</h4><ul><li><strong>King</strong>: One square in any direction</li><li><strong>Queen</strong>: Any number of squares in any direction</li><li><strong>Rook</strong>: Any number of squares horizontally/vertically</li><li><strong>Bishop</strong>: Any number of squares diagonally</li><li><strong>Knight</strong>: L-shape (2+1), can jump over pieces</li><li><strong>Pawn</strong>: Forward 1 (or 2 from start), captures diagonally</li></ul><h4>Special Moves</h4><ul><li><strong>Castling</strong>: King moves 2 squares toward rook, rook jumps over</li><li><strong>En Passant</strong>: Pawn captures opponent's pawn that just moved 2 squares</li><li><strong>Promotion</strong>: Pawn reaches opposite end, promotes to Queen/Rook/Bishop/Knight</li></ul><h4>Check & Checkmate</h4><ul><li><strong>Check</strong>: King is under attack</li><li><strong>Checkmate</strong>: King is in check and cannot escape</li><li><strong>Stalemate</strong>: No legal moves but king is NOT in check (draw)</li></ul>",credits:"<h3>Chess: Cream Soda Edition</h3><h4>Game Design & Development</h4><p>Jake A. McCoy</p><h4>Publisher</h4><p><strong>magmacrunch media</strong></p><h4>Built With</h4><p>Vanilla HTML, CSS & JavaScript · Litho Display font · Two-colour window system</p><h4>Cheapness Impact Factor</h4><p>1.1</p><h4>About</h4><p>Classic chess on a two-colour window system. Play against the AI opponent with configurable difficulty and time controls!</p>"});(function(){var extra=document.getElementById("chessGameExtra");var layout=document.querySelector(".game-layout");if(extra&&layout){var clone=extra.content.cloneNode(true);var boardArea=layout.querySelector(".board-area");var timerContainer=clone.querySelector(".timer-container");var sidePanel=clone.querySelector(".side-panel");if(timerContainer)layout.insertBefore(timerContainer,boardArea);if(sidePanel)layout.appendChild(sidePanel)}})();
</script>
