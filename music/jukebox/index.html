<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jukebox · magmacrunch media</title>
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../style.css?v=6b1e19d6">
    <link rel="stylesheet" href="styles.css?v=9d72acb3">
    <link rel="stylesheet" href="../music-chrome.css?v=01907463">
</head>
<body class="music-chrome">

<nav id="auto-nav" data-depth="../../"></nav>

<main>

    <div class="breadcrumb">
        <a href="../../">home</a>
        <span class="sep">›</span>
        <a href="../../music/">music</a>
        <span class="sep">›</span>
        <span class="current">jukebox</span>
    </div>


    <div class="jukebox">
        <div class="jukebox-inner">
        <div class="title-strip">
            <div class="title-strip-text">// jukebox //</div>
            <div class="neon-lights" id="neonLights">
                <div class="neon-light" id="light1"></div>
                <div class="neon-light" id="light2"></div>
                <div class="neon-light" id="light3"></div>
                <div class="neon-light" id="light4"></div>
                <div class="neon-light" id="light5"></div>
                <div class="neon-light" id="light6"></div>
            </div>
        </div>
        <div class="checker-strip"></div>

        <div class="cabinet-stripes">
            <div class="cabinet-stripe"></div>
            <div class="cabinet-stripe"></div>
            <div class="cabinet-stripe"></div>
            <div class="cabinet-stripe"></div>
            <div class="cabinet-stripe"></div>
            <div class="cabinet-stripe"></div>
        </div>

        <div class="coin-slot-strip">
            <div class="coin-slot-label">INSERT COIN</div>
            <div class="coin-slot"></div>
        </div>

        <div class="now-playing">
            <div class="np-label">NOW PLAYING</div>
            <div class="np-title" id="npTitle">— select a song —</div>
            <div class="np-artist" id="npArtist"></div>
            <div class="np-time">
                <span class="elapsed" id="npElapsed">0:00</span>
                <span class="sep">/</span>
                <span id="npDuration">0:00</span>
            </div>
            <div class="playing-indicator" id="playingIndicator">
                <div class="pi-bar"></div>
                <div class="pi-bar"></div>
                <div class="pi-bar"></div>
                <div class="pi-bar"></div>
                <div class="pi-bar"></div>
            </div>
        </div>

        <div class="song-list">
            <div class="song-list-header">
                <span class="sl-title">SONG SELECTIONS</span>
                <span class="sl-page" id="slPage"></span>
            </div>
            <div class="song-list-inner" id="songListInner"></div>
        </div>

        <div class="play-controls">
            <button class="ctrl-btn" id="playBtn">PLAY</button>
            <button class="ctrl-btn stop" id="stopBtn">STOP</button>
        </div>

        <div class="queue-display" id="queueDisplay">
            <div class="queue-label">UP NEXT</div>
            <div class="queue-list" id="queueList">
                <div class="queue-empty">queue empty</div>
            </div>
        </div>

        <div class="juke-footer">select • play • enjoy</div>
        </div>
    </div>

</main>

<footer>
    &copy; 2026 <span>magmacrunch media</span>
</footer>

<script src="../../nav.js?v=9b2224ed"></script>
<script src="../distributed-music/releases.js?v=37bc1e6e"></script>
<script src="../../assets/jukebox.js?v=23ee3b84"></script>
<script src="app.js?v=ab086da7"></script>

</body>
</html>
