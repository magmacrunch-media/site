const canvas=document.getElementById("spriteCanvas");const ctx=canvas.getContext("2d");const colors={".":"transparent","H":"#5d4037","S":"#f4d5b5","E":"#2c3e50","C":"#2c3e50","J":"#34495e","F":"#95a5a6","M":"rgba(52, 152, 219, 0.25)","G":"rgba(196, 95, 255, 0.4)"};const dagSprite=["......HHHH......",".....HSSSSH.....",".....HSEESH.....","......SSSS......",".......FF.......","...JJJJCCJJJJ...","..J..JJJJJJ..J..","..J..JJJJJJ..J..","..S..JJJJJJ..S..",".......CC.......",".......CC.......","......C..C......","......J..J......"];const particles=[];for(let i=0;i<7;i++){particles.push({x:32+(Math.random()-.5)*12,y:20+Math.random()*30,offset:i*.8})}function drawPixelArt(matrix,startX,startY,ghostOpacity=1){for(let y=0;y<matrix.length;y++){let row=matrix[y];for(let x=0;x<row.length;x++){let char=row[x];if(char!=="."){ctx.fillStyle=colors[char];if(char==="G"){ctx.fillStyle=`rgba(196, 95, 255, ${ghostOpacity})`}ctx.fillRect(startX+x,startY+y,1,1)}}}}function drawMirror(pulse){ctx.fillStyle=`rgba(196, 95, 255, ${.15+pulse*.1})`;ctx.fillRect(31,15,2,40)}function drawParticles(time2){particles.forEach((p,i)=>{let drift=Math.sin(time2+p.offset)*2;let currentY=p.y+drift;let opacity=.15+Math.abs(Math.sin(time2*.8+i))*.5;ctx.fillStyle=`rgba(149, 165, 166, ${opacity})`;ctx.fillRect(Math.floor(p.x),Math.floor(currentY),1,1)})}let time=0;function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);time+=.05;let breatheOffset=Math.sin(time)>0?0:1;const shadowPulse=.3+Math.sin(time*1.5)*.15;drawMirror(shadowPulse);drawPixelArt(dagSprite,10,25+breatheOffset);const ghostSprite=dagSprite.map(row=>row.replace(/[HSEJC]/g,"G").replace(/F/g,"."));drawPixelArt(ghostSprite,38,25+breatheOffset,shadowPulse);drawParticles(time);dagRafId=requestAnimationFrame(animate)}let dagRafId;animate();window.__pageCleanup=function(){cancelAnimationFrame(dagRafId)};
